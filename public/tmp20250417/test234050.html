<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect+ | Social Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Navbar -->
    <nav class="bg-white shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl font-bold text-indigo-600">Connect+</span>
            </div>
            <div class="flex items-center space-x-4">
                <button class="text-gray-600 hover:text-indigo-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                    </svg>
                </button>
                <button class="text-gray-600 hover:text-indigo-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-6xl mx-auto px-4 py-6 grid grid-cols-1 md:grid-cols-4 gap-6">
        <!-- Left Sidebar - User Profile -->
        <div class="bg-white rounded-lg shadow-sm p-4 md:col-span-1">
            <div class="flex flex-col items-center">
                <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?ixlib=rb-1.2.1&auto=format&fit=crop&w=200&h=200&q=80" alt="Profile" class="w-24 h-24 rounded-full object-cover mb-4">
                <h3 class="font-semibold text-lg">Jane Doe</h3>
                <p class="text-gray-500 text-sm">@janedoe</p>
                <div class="mt-4 flex flex-wrap gap-2">
                    <span class="px-2 py-1 bg-indigo-100 text-indigo-800 text-xs rounded-full">Photography</span>
                    <span class="px-2 py-1 bg-indigo-100 text-indigo-800 text-xs rounded-full">Travel</span>
                    <span class="px-2 py-1 bg-indigo-100 text-indigo-800 text-xs rounded-full">Tech</span>
                </div>
                <button class="mt-6 w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700">Edit Profile</button>
            </div>
        </div>

        <!-- Center Content - Feed -->
        <div class="bg-white rounded-lg shadow-sm p-4 md:col-span-2">
            <div class="mb-6">
                <textarea class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="What's on your mind?"></textarea>
                <div class="flex justify-between mt-3">
                    <div class="flex space-x-2">
                        <button class="text-gray-500 hover:text-indigo-600">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                        </button>
                        <button class="text-gray-500 hover:text-indigo-600">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                            </svg>
                        </button>
                    </div>
                    <button class="bg-indigo-600 text-white px-4 py-1 rounded-lg hover:bg-indigo-700">Post</button>
                </div>
            </div>

            <!-- Feed Item -->
            <div class="border-b border-gray-200 pb-4 mb-4">
                <div class="flex items-center space-x-3 mb-3">
                    <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?ixlib=rb-1.2.1&auto=format&fit=crop&w=40&h=40&q=80" alt="User" class="w-10 h-10 rounded-full">
                    <div>
                        <h4 class="font-medium">John Smith</h4>
                        <p class="text-gray-500 text-xs">2 hours ago</p>
                    </div>
                </div>
                <p class="mb-3">Just visited the new art exhibition downtown. Highly recommend it! 🎨</p>
                <img src="https://images.unsplash.com/photo-1547891654-e66ed7ebb968?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&h=300&q=80" alt="Post" class="w-full rounded-lg mb-3">
                <div class="flex justify-between text-gray-500">
                    <button class="flex items-center space-x-1 hover:text-indigo-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10h4.764a2 2 0 011.789 2.894l-4.764 8.928A2 2 0 0114 21h-4.764a2 2 0 01-1.789-2.894l4.764-8.928A2 2 0 0114 10z" />
                        </svg>
                        <span>24</span>
                    </button>
                    <button class="flex items-center space-x-1 hover:text-indigo-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                        </svg>
                        <span>5</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Sidebar - Matches & Groups -->
        <div class="bg-white rounded-lg shadow-sm p-4 md:col-span-1">
            <h3 class="font-semibold mb-4">New Matches</h3>
            <div class="space-y-4">
                <div class="flex items-center space-x-3">
                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?ixlib=rb-1.2.1&auto=format&fit=crop&w=40&h=40&q=80" alt="Match" class="w-10 h-10 rounded-full">
                    <div>
                        <h4 class="font-medium">Alex</h4>
                        <p class="text-gray-500 text-xs">Photography, Travel</p>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <img src="https://images.unsplash.com/photo-1531123897727-8f129e1688ce?ixlib=rb-1.2.1&auto=format&fit=crop&w=40&h=40&q=80" alt="Match" class="w-10 h-10 rounded-full">
                    <div>
                        <h4 class="font-medium">Sam</h4>
                        <p class="text-gray-500 text-xs">Tech, Gaming</p>
                    </div>
                </div>
            </div>

            <h3 class="font-semibold mt-6 mb-4">Your Groups</h3>
            <div class="space-y-4">
                <div class="flex items-center space-x-3">
                    <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?ixlib=rb-1.2.1&auto=format&fit=crop&w=40&h=40&q=80" alt="Group" class="w-10 h-10 rounded-full">
                    <div>
                        <h4 class="font-medium">Photography Enthusiasts</h4>
                        <p class="text-gray-500 text-xs">245 members</p>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <img src="https://images.unsplash.com/photo-1519241045347-1f15c2b3e582?ixlib=rb-1.2.1&auto=format&fit=crop&w=40&h=40&q=80" alt="Group" class="w-10 h-10 rounded-full">
                    <div>
                        <h4 class="font-medium">Tech Talk</h4>
                        <p class="text-gray-500 text-xs">189 members</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
