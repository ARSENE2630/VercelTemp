<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黄金投资平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="container mx-auto p-4">
        <header class="bg-yellow-600 text-white p-4 rounded-lg shadow-md mb-6">
            <h1 class="text-2xl font-bold">黄金投资平台</h1>
            <p class="text-sm">实时市场数据与交易</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- 市场趋势图 -->
            <div class="md:col-span-2 bg-white p-4 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4 text-gray-800">黄金价格趋势</h2>
                <div class="h-64">
                    <canvas id="goldPriceChart"></canvas>
                </div>
                <div class="mt-4 flex justify-between">
                    <button class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">1D</button>
                    <button class="bg-gray-200 text-gray-800 px-4 py-2 rounded hover:bg-gray-300">1W</button>
                    <button class="bg-gray-200 text-gray-800 px-4 py-2 rounded hover:bg-gray-300">1M</button>
                    <button class="bg-gray-200 text-gray-800 px-4 py-2 rounded hover:bg-gray-300">1Y</button>
                </div>
            </div>

            <!-- 交易选项 -->
            <div class="bg-white p-4 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4 text-gray-800">交易</h2>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">当前价格</label>
                    <div class="text-2xl font-bold text-yellow-600">$1,850.25</div>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">交易类型</label>
                    <div class="flex space-x-2">
                        <button class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">买入</button>
                        <button class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">卖出</button>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">数量 (克)</label>
                    <input type="number" class="w-full p-2 border rounded" placeholder="0.00">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">总金额</label>
                    <div class="text-xl font-semibold">$0.00</div>
                </div>
                <button class="w-full bg-yellow-600 text-white px-4 py-2 rounded hover:bg-yellow-700">确认交易</button>
            </div>
        </div>

        <!-- 市场新闻 -->
        <div class="mt-6 bg-white p-4 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4 text-gray-800">市场新闻</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="border p-4 rounded-lg">
                    <h3 class="font-semibold text-gray-800">黄金价格因美元走强下跌</h3>
                    <p class="text-sm text-gray-600 mt-2">由于美元指数上涨，黄金价格今日下跌1.5%。</p>
                </div>
                <div class="border p-4 rounded-lg">
                    <h3 class="font-semibold text-gray-800">央行增持黄金储备</h3>
                    <p class="text-sm text-gray-600 mt-2">全球央行继续增持黄金，市场预期价格将回升。</p>
                </div>
                <div class="border p-4 rounded-lg">
                    <h3 class="font-semibold text-gray-800">投资者转向避险资产</h3>
                    <p class="text-sm text-gray-600 mt-2">全球经济不确定性推动投资者转向黄金等避险资产。</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 初始化图表
        const ctx = document.getElementById('goldPriceChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['1月', '2月', '3月', '4月', '5月', '6月'],
                datasets: [{
                    label: '黄金价格 (美元/克)',
                    data: [1800, 1820, 1850, 1830, 1860, 1850],
                    borderColor: 'rgba(234, 179, 8, 1)',
                    backgroundColor: 'rgba(234, 179, 8, 0.1)',
                    tension: 0.4,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'top',
                    }
                },
                scales: {
                    y: {
                        beginAtZero: false
                    }
                }
            }
        });
    </script>
</body>
</html>
