<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务分配功能</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="container mx-auto p-4">
        <!-- 头部 -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">项目名称</h1>
            <button class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">创建任务</button>
        </div>

        <!-- 任务列表 -->
        <div class="bg-white rounded-lg shadow-md p-4">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-gray-800">任务列表</h2>
                <div class="flex space-x-2">
                    <button class="bg-gray-200 text-gray-700 px-3 py-1 rounded-lg hover:bg-gray-300">批量分配</button>
                </div>
            </div>

            <!-- 任务项 -->
            <div class="space-y-3">
                <!-- 任务1 -->
                <div class="flex items-center justify-between p-3 border border-gray-200 rounded-lg hover:bg-gray-50">
                    <div class="flex items-center space-x-3">
                        <input type="checkbox" class="h-4 w-4 text-blue-600 rounded">
                        <div>
                            <h3 class="font-medium text-gray-800">设计登录页面</h3>
                            <p class="text-sm text-gray-500">截止日期：2023-10-15</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="flex items-center space-x-1">
                            <span class="h-2 w-2 rounded-full bg-yellow-500"></span>
                            <span class="text-sm text-gray-600">中</span>
                        </div>
                        <div class="flex items-center space-x-1">
                            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100" class="h-6 w-6 rounded-full">
                            <span class="text-sm text-gray-600">未分配</span>
                        </div>
                        <button class="text-blue-600 hover:text-blue-800">编辑</button>
                    </div>
                </div>

                <!-- 任务2 -->
                <div class="flex items-center justify-between p-3 border border-gray-200 rounded-lg hover:bg-gray-50">
                    <div class="flex items-center space-x-3">
                        <input type="checkbox" class="h-4 w-4 text-blue-600 rounded">
                        <div>
                            <h3 class="font-medium text-gray-800">开发API接口</h3>
                            <p class="text-sm text-gray-500">截止日期：2023-10-20</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="flex items-center space-x-1">
                            <span class="h-2 w-2 rounded-full bg-red-500"></span>
                            <span class="text-sm text-gray-600">高</span>
                        </div>
                        <div class="flex items-center space-x-1">
                            <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100" class="h-6 w-6 rounded-full">
                            <span class="text-sm text-gray-600">张三</span>
                        </div>
                        <button class="text-blue-600 hover:text-blue-800">编辑</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 创建任务模态框 -->
        <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden" id="modal">
            <div class="bg-white rounded-lg p-6 w-full max-w-md">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-gray-800">创建任务</h2>
                    <button onclick="document.getElementById('modal').classList.add('hidden')" class="text-gray-500 hover:text-gray-700">×</button>
                </div>
                <form class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">任务名称</label>
                        <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">任务描述</label>
                        <textarea class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">截止日期</label>
                        <input type="date" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">优先级</label>
                        <select class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="low">低</option>
                            <option value="medium" selected>中</option>
                            <option value="high">高</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">分配给</label>
                        <select class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">未分配</option>
                            <option value="1">张三</option>
                            <option value="2">李四</option>
                            <option value="3">王五</option>
                        </select>
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" onclick="document.getElementById('modal').classList.add('hidden')" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">取消</button>
                        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.querySelector('button').addEventListener('click', function() {
            document.getElementById('modal').classList.remove('hidden');
        });
    </script>
</body>
</html>
