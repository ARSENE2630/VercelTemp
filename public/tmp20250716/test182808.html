<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优车拍拍卖大厅</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <header class="bg-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-600">优车拍</h1>
            <div class="flex items-center space-x-4">
                <button class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">登录</button>
                <button class="px-4 py-2 border border-blue-600 text-blue-600 rounded-md hover:bg-blue-50">注册</button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <div class="mb-8">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold">拍卖大厅</h2>
                <div class="flex items-center space-x-2">
                    <input type="text" placeholder="搜索车辆..." class="px-4 py-2 border rounded-md w-64">
                    <button class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">搜索</button>
                </div>
            </div>

            <div class="bg-white p-4 rounded-md shadow-md mb-6">
                <div class="flex space-x-4">
                    <div class="w-1/4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">品牌</label>
                        <select class="w-full px-3 py-2 border rounded-md">
                            <option>全部</option>
                            <option>奥迪</option>
                            <option>宝马</option>
                            <option>奔驰</option>
                        </select>
                    </div>
                    <div class="w-1/4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">价格区间</label>
                        <select class="w-full px-3 py-2 border rounded-md">
                            <option>全部</option>
                            <option>0-5万</option>
                            <option>5-10万</option>
                            <option>10-20万</option>
                        </select>
                    </div>
                    <div class="w-1/4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">车龄</label>
                        <select class="w-full px-3 py-2 border rounded-md">
                            <option>全部</option>
                            <option>1年内</option>
                            <option>1-3年</option>
                            <option>3年以上</option>
                        </select>
                    </div>
                    <div class="w-1/4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">里程</label>
                        <select class="w-full px-3 py-2 border rounded-md">
                            <option>全部</option>
                            <option>1万公里内</option>
                            <option>1-5万公里</option>
                            <option>5万公里以上</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- 车辆卡片 -->
                <div class="bg-white rounded-md shadow-md overflow-hidden">
                    <img id="car-image-1" class="w-full h-48 object-cover" alt="车辆图片">
                    <div class="p-4">
                        <h3 class="text-lg font-semibold mb-2">奥迪 A4L 2020款</h3>
                        <div class="flex justify-between mb-2">
                            <span class="text-gray-600">里程: 3.2万公里</span>
                            <span class="text-gray-600">车龄: 2年</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-red-600 font-bold">¥ 18.5万</span>
                            <button class="px-3 py-1 bg-blue-600 text-white rounded-md hover:bg-blue-700">竞拍</button>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-md shadow-md overflow-hidden">
                    <img id="car-image-2" class="w-full h-48 object-cover" alt="车辆图片">
                    <div class="p-4">
                        <h3 class="text-lg font-semibold mb-2">宝马 3系 2019款</h3>
                        <div class="flex justify-between mb-2">
                            <span class="text-gray-600">里程: 4.5万公里</span>
                            <span class="text-gray-600">车龄: 3年</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-red-600 font-bold">¥ 22.3万</span>
                            <button class="px-3 py-1 bg-blue-600 text-white rounded-md hover:bg-blue-700">竞拍</button>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-md shadow-md overflow-hidden">
                    <img id="car-image-3" class="w-full h-48 object-cover" alt="车辆图片">
                    <div class="p-4">
                        <h3 class="text-lg font-semibold mb-2">奔驰 C级 2021款</h3>
                        <div class="flex justify-between mb-2">
                            <span class="text-gray-600">里程: 1.8万公里</span>
                            <span class="text-gray-600">车龄: 1年</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-red-600 font-bold">¥ 25.7万</span>
                            <button class="px-3 py-1 bg-blue-600 text-white rounded-md hover:bg-blue-700">竞拍</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-gray-800 text-white py-6">
        <div class="container mx-auto px-4">
            <div class="flex justify-between">
                <div>
                    <h3 class="text-lg font-semibold mb-2">关于我们</h3>
                    <p class="text-gray-400">优车拍是一家专业的二手车拍卖平台。</p>
                </div>
                <div>
                    <h3 class="text-lg font-semibold mb-2">联系我们</h3>
                    <p class="text-gray-400">电话: 400-123-4567</p>
                    <p class="text-gray-400">邮箱: support@youchepai.com</p>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // 获取车辆图片
        async function fetchCarImages() {
            const token = "WRYFBaXSAqLjxoOeBKmP_8Af4_ad9gCJXKgbgpW0KtY";
            const queries = ["car", "audi", "bmw", "mercedes"];
            
            for (let i = 1; i <= 3; i++) {
                const query = queries[i - 1];
                const response = await fetch(`https://api.unsplash.com/photos/random?query=${query}&client_id=${token}`);
                const data = await response.json();
                const imageUrl = `${data.urls.regular}&w=300&h=200&dpr=2`;
                document.getElementById(`car-image-${i}`).src = imageUrl;
            }
        }

        fetchCarImages();
    </script>
</body>
</html>
