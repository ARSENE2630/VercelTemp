<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Image Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8">Simple Image Gallery</h1>
        
        <!-- Search Box -->
        <div class="flex justify-center mb-8">
            <input type="text" placeholder="Search for images..." class="px-4 py-2 border rounded-l-lg w-64 focus:outline-none">
            <button class="bg-blue-500 text-white px-4 py-2 rounded-r-lg hover:bg-blue-600">Search</button>
        </div>
        
        <!-- Image Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Image Card 1 -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <img src="https://images.unsplash.com/photo-1682686580391-615b4f1f48ff?w=300&h=200&dpr=2" alt="Nature" class="w-full h-48 object-cover">
                <div class="p-4">
                    <h2 class="text-xl font-semibold mb-2">Nature</h2>
                    <p class="text-gray-600">Beautiful nature scenery.</p>
                </div>
            </div>
            
            <!-- Image Card 2 -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <img src="https://images.unsplash.com/photo-1682695796954-bad0d0f59ff1?w=300&h=200&dpr=2" alt="City" class="w-full h-48 object-cover">
                <div class="p-4">
                    <h2 class="text-xl font-semibold mb-2">City</h2>
                    <p class="text-gray-600">Urban city landscape.</p>
                </div>
            </div>
            
            <!-- Image Card 3 -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <img src="https://images.unsplash.com/photo-1682686580391-615b4f1f48ff?w=300&h=200&dpr=2" alt="Beach" class="w-full h-48 object-cover">
                <div class="p-4">
                    <h2 class="text-xl font-semibold mb-2">Beach</h2>
                    <p class="text-gray-600">Relaxing beach view.</p>
                </div>
            </div>
            
            <!-- Image Card 4 -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <img src="https://images.unsplash.com/photo-1682695796954-bad0d0f59ff1?w=300&h=200&dpr=2" alt="Mountains" class="w-full h-48 object-cover">
                <div class="p-4">
                    <h2 class="text-xl font-semibold mb-2">Mountains</h2>
                    <p class="text-gray-600">Majestic mountain peaks.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
