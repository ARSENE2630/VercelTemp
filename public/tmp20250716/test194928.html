<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电商APP首页</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-4">
        <!-- 顶部导航栏 -->
        <header class="flex justify-between items-center mb-6">
            <div class="flex items-center space-x-2">
                <span class="text-2xl font-bold text-blue-600">ShopEasy</span>
            </div>
            <div class="flex space-x-4">
                <button class="text-gray-600 hover:text-blue-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </button>
                <button class="text-gray-600 hover:text-blue-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                    </svg>
                </button>
                <button class="text-gray-600 hover:text-blue-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- 轮播图 -->
        <div class="mb-6 rounded-lg overflow-hidden">
            <img src="https://images.unsplash.com/photo-1605902711834-8b11c3e3ef2f?ixid=M3w3Nzg5NTl8MHwxfHJhbmRvbXx8fHx8fHx8fDE3NTI2NjY0NzZ8&ixlib=rb-4.1.0&w=600&h=300&dpr=2" alt="Ecommerce Banner" class="w-full h-48 object-cover rounded-lg">
        </div>

        <!-- 分类入口 -->
        <div class="mb-6 bg-white p-4 rounded-lg shadow-md">
            <h2 class="text-lg font-semibold mb-4">热门分类</h2>
            <div class="grid grid-cols-4 gap-4">
                <div class="text-center">
                    <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-2">
                        <span class="text-blue-600">👕</span>
                    </div>
                    <p class="text-sm">服装</p>
                </div>
                <div class="text-center">
                    <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-2">
                        <span class="text-blue-600">📱</span>
                    </div>
                    <p class="text-sm">电子产品</p>
                </div>
                <div class="text-center">
                    <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-2">
                        <span class="text-blue-600">🏠</span>
                    </div>
                    <p class="text-sm">家居</p>
                </div>
                <div class="text-center">
                    <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-2">
                        <span class="text-blue-600">🍎</span>
                    </div>
                    <p class="text-sm">生鲜</p>
                </div>
            </div>
        </div>

        <!-- 商品列表 -->
        <div class="mb-6">
            <h2 class="text-lg font-semibold mb-4">推荐商品</h2>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white p-4 rounded-lg shadow-md">
                    <img src="https://images.unsplash.com/photo-1605902711834-8b11c3e3ef2f?ixid=M3w3Nzg5NTl8MHwxfHJhbmRvbXx8fHx8fHx8fDE3NTI2NjY0NzZ8&ixlib=rb-4.1.0&w=200&h=200&dpr=2" alt="Product" class="w-full h-32 object-cover rounded-md mb-2">
                    <h3 class="font-medium">时尚T恤</h3>
                    <p class="text-gray-600 text-sm mb-2">¥99.00</p>
                    <button class="w-full bg-blue-600 text-white py-1 rounded-md text-sm hover:bg-blue-700">加入购物车</button>
                </div>
                <div class="bg-white p-4 rounded-lg shadow-md">
                    <img src="https://images.unsplash.com/photo-1605902711834-8b11c3e3ef2f?ixid=M3w3Nzg5NTl8MHwxfHJhbmRvbXx8fHx8fHx8fDE3NTI2NjY0NzZ8&ixlib=rb-4.1.0&w=200&h=200&dpr=2" alt="Product" class="w-full h-32 object-cover rounded-md mb-2">
                    <h3 class="font-medium">无线耳机</h3>
                    <p class="text-gray-600 text-sm mb-2">¥299.00</p>
                    <button class="w-full bg-blue-600 text-white py-1 rounded-md text-sm hover:bg-blue-700">加入购物车</button>
                </div>
            </div>
        </div>

        <!-- 底部导航栏 -->
        <footer class="fixed bottom-0 left-0 right-0 bg-white shadow-lg py-2 px-4">
            <div class="flex justify-around">
                <button class="text-blue-600 flex flex-col items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    <span class="text-xs">首页</span>
                </button>
                <button class="text-gray-600 flex flex-col items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                    <span class="text-xs">分类</span>
                </button>
                <button class="text-gray-600 flex flex-col items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                    </svg>
                    <span class="text-xs">购物车</span>
                </button>
                <button class="text-gray-600 flex flex-col items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                    <span class="text-xs">我的</span>
                </button>
            </div>
        </footer>
    </div>
</body>
</html>
