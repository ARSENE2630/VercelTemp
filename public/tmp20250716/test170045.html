<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优车拍拍卖大厅</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="text-xl font-bold text-blue-600">优车拍</div>
            <div class="flex space-x-4">
                <a href="#" class="text-gray-700 hover:text-blue-600">首页</a>
                <a href="#" class="text-gray-700 hover:text-blue-600">拍卖大厅</a>
                <a href="#" class="text-gray-700 hover:text-blue-600">我的竞拍</a>
                <a href="#" class="text-gray-700 hover:text-blue-600">个人中心</a>
            </div>
        </div>
    </nav>

    <!-- 搜索筛选区 -->
    <div class="container mx-auto px-4 py-6">
        <div class="bg-white rounded-lg shadow-md p-4">
            <div class="flex flex-wrap gap-4">
                <div class="w-full md:w-1/4">
                    <label class="block text-gray-700 mb-2">品牌</label>
                    <select class="w-full p-2 border rounded">
                        <option>全部</option>
                        <option>奥迪</option>
                        <option>宝马</option>
                        <option>奔驰</option>
                    </select>
                </div>
                <div class="w-full md:w-1/4">
                    <label class="block text-gray-700 mb-2">价格区间</label>
                    <select class="w-full p-2 border rounded">
                        <option>全部</option>
                        <option>0-5万</option>
                        <option>5-10万</option>
                        <option>10-20万</option>
                    </select>
                </div>
                <div class="w-full md:w-1/4">
                    <label class="block text-gray-700 mb-2">车龄</label>
                    <select class="w-full p-2 border rounded">
                        <option>全部</option>
                        <option>1年内</option>
                        <option>1-3年</option>
                        <option>3年以上</option>
                    </select>
                </div>
                <div class="w-full md:w-1/4">
                    <label class="block text-gray-700 mb-2">排序</label>
                    <select class="w-full p-2 border rounded">
                        <option>默认排序</option>
                        <option>价格从低到高</option>
                        <option>价格从高到低</option>
                        <option>最新上架</option>
                    </select>
                </div>
            </div>
            <div class="mt-4">
                <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">搜索</button>
            </div>
        </div>
    </div>

    <!-- 车辆列表 -->
    <div class="container mx-auto px-4 py-6">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 车辆卡片 1 -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <img src="https://source.unsplash.com/random/300x200/?car" alt="车辆图片" class="w-full h-48 object-cover">
                <div class="p-4">
                    <h3 class="text-lg font-semibold text-gray-800">奥迪 A4L 2020款</h3>
                    <p class="text-gray-600">里程：3.2万公里 | 上牌：2020年</p>
                    <div class="mt-4 flex justify-between items-center">
                        <span class="text-xl font-bold text-blue-600">¥18.5万</span>
                        <button class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">立即竞拍</button>
                    </div>
                </div>
            </div>

            <!-- 车辆卡片 2 -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <img src="https://source.unsplash.com/random/300x200/?car" alt="车辆图片" class="w-full h-48 object-cover">
                <div class="p-4">
                    <h3 class="text-lg font-semibold text-gray-800">宝马 5系 2019款</h3>
                    <p class="text-gray-600">里程：4.5万公里 | 上牌：2019年</p>
                    <div class="mt-4 flex justify-between items-center">
                        <span class="text-xl font-bold text-blue-600">¥22.8万</span>
                        <button class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">立即竞拍</button>
                    </div>
                </div>
            </div>

            <!-- 车辆卡片 3 -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <img src="https://source.unsplash.com/random/300x200/?car" alt="车辆图片" class="w-full h-48 object-cover">
                <div class="p-4">
                    <h3 class="text-lg font-semibold text-gray-800">奔驰 C级 2021款</h3>
                    <p class="text-gray-600">里程：1.8万公里 | 上牌：2021年</p>
                    <div class="mt-4 flex justify-between items-center">
                        <span class="text-xl font-bold text-blue-600">¥25.3万</span>
                        <button class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">立即竞拍</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 分页 -->
    <div class="container mx-auto px-4 py-6">
        <div class="flex justify-center">
            <nav class="flex items-center space-x-2">
                <a href="#" class="px-3 py-1 border rounded text-gray-600 hover:bg-gray-100">上一页</a>
                <a href="#" class="px-3 py-1 border rounded bg-blue-600 text-white">1</a>
                <a href="#" class="px-3 py-1 border rounded text-gray-600 hover:bg-gray-100">2</a>
                <a href="#" class="px-3 py-1 border rounded text-gray-600 hover:bg-gray-100">3</a>
                <a href="#" class="px-3 py-1 border rounded text-gray-600 hover:bg-gray-100">下一页</a>
            </nav>
        </div>
    </div>
</body>
</html>
