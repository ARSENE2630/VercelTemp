<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Image Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8">Simple Image Gallery</h1>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Image 1 -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <img src="https://source.unsplash.com/random/300x200/?nature" alt="Nature" class="w-full h-48 object-cover">
                <div class="p-4">
                    <h2 class="text-xl font-semibold mb-2">Nature</h2>
                    <p class="text-gray-600">A beautiful scene from nature.</p>
                </div>
            </div>
            <!-- Image 2 -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <img src="https://source.unsplash.com/random/300x200/?city" alt="City" class="w-full h-48 object-cover">
                <div class="p-4">
                    <h2 class="text-xl font-semibold mb-2">City</h2>
                    <p class="text-gray-600">A vibrant cityscape.</p>
                </div>
            </div>
            <!-- Image 3 -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <img src="https://source.unsplash.com/random/300x200/?technology" alt="Technology" class="w-full h-48 object-cover">
                <div class="p-4">
                    <h2 class="text-xl font-semibold mb-2">Technology</h2>
                    <p class="text-gray-600">Modern technology in action.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
