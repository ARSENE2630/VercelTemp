<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优车拍拍卖大厅</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <!-- 顶部导航栏 -->
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center">
                <h1 class="text-xl font-bold text-blue-600">优车拍</h1>
                <span class="ml-2 text-gray-600">拍卖大厅</span>
            </div>
            <div class="flex items-center space-x-4">
                <button class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">登录</button>
                <button class="px-4 py-2 border border-blue-600 text-blue-600 rounded-md hover:bg-blue-50">注册</button>
            </div>
        </div>
    </nav>

    <!-- 搜索筛选区域 -->
    <div class="container mx-auto px-4 py-6">
        <div class="bg-white p-4 rounded-lg shadow-md">
            <div class="flex flex-wrap gap-4">
                <div class="w-full md:w-1/4">
                    <label class="block text-gray-700 mb-2">品牌</label>
                    <select class="w-full p-2 border border-gray-300 rounded-md">
                        <option>全部</option>
                        <option>奥迪</option>
                        <option>宝马</option>
                        <option>奔驰</option>
                    </select>
                </div>
                <div class="w-full md:w-1/4">
                    <label class="block text-gray-700 mb-2">价格区间</label>
                    <select class="w-full p-2 border border-gray-300 rounded-md">
                        <option>全部</option>
                        <option>0-5万</option>
                        <option>5-10万</option>
                        <option>10-20万</option>
                    </select>
                </div>
                <div class="w-full md:w-1/4">
                    <label class="block text-gray-700 mb-2">车龄</label>
                    <select class="w-full p-2 border border-gray-300 rounded-md">
                        <option>全部</option>
                        <option>1年内</option>
                        <option>1-3年</option>
                        <option>3年以上</option>
                    </select>
                </div>
                <div class="w-full md:w-1/4 flex items-end">
                    <button class="w-full p-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">搜索</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 拍卖车辆列表 -->
    <div class="container mx-auto px-4 py-6">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 车辆卡片 1 -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <img id="car-image-1" class="w-full h-48 object-cover" src="https://images.unsplash.com/photo-1494976388531-d1058494cdd8?auto=format&fit=crop&w=600&h=300&dpr=2" alt="Car Image">
                <div class="p-4">
                    <h3 class="text-lg font-semibold">奥迪 A4L 2020款</h3>
                    <p class="text-gray-600">2.0T 自动 豪华型</p>
                    <div class="mt-4 flex justify-between items-center">
                        <span class="text-xl font-bold text-blue-600">¥15.8万</span>
                        <button class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700">立即竞拍</button>
                    </div>
                </div>
            </div>

            <!-- 车辆卡片 2 -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <img id="car-image-2" class="w-full h-48 object-cover" src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=600&h=300&dpr=2" alt="Car Image">
                <div class="p-4">
                    <h3 class="text-lg font-semibold">宝马 5系 2019款</h3>
                    <p class="text-gray-600">2.0T 自动 尊享型</p>
                    <div class="mt-4 flex justify-between items-center">
                        <span class="text-xl font-bold text-blue-600">¥22.5万</span>
                        <button class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700">立即竞拍</button>
                    </div>
                </div>
            </div>

            <!-- 车辆卡片 3 -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <img id="car-image-3" class="w-full h-48 object-cover" src="https://images.unsplash.com/photo-1553440569-bcc63803a83d?auto=format&fit=crop&w=600&h=300&dpr=2" alt="Car Image">
                <div class="p-4">
                    <h3 class="text-lg font-semibold">奔驰 E级 2021款</h3>
                    <p class="text-gray-600">2.0T 自动 豪华型</p>
                    <div class="mt-4 flex justify-between items-center">
                        <span class="text-xl font-bold text-blue-600">¥28.3万</span>
                        <button class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700">立即竞拍</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 分页 -->
    <div class="container mx-auto px-4 py-6 flex justify-center">
        <div class="flex space-x-2">
            <button class="px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-100">上一页</button>
            <button class="px-4 py-2 bg-blue-600 text-white rounded-md">1</button>
            <button class="px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-100">2</button>
            <button class="px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-100">3</button>
            <button class="px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-100">下一页</button>
        </div>
    </div>

    <script>
        // 动态获取车辆图片
        async function fetchCarImages() {
            const unsplashToken = "WRYFBaXSAqLjxoOeBKmP_8Af4_ad9gCJXKgbgpW0KtY";
            const query = "car";

            try {
                const response = await fetch(`https://api.unsplash.com/photos/random?query=${query}&client_id=${unsplashToken}`);
                const data = await response.json();
                return data.urls.regular;
            } catch (error) {
                console.error("Error fetching car images:", error);
                return "https://images.unsplash.com/photo-1494976388531-d1058494cdd8?auto=format&fit=crop&w=600&h=300&dpr=2";
            }
        }

        // 更新车辆图片
        document.addEventListener("DOMContentLoaded", async () => {
            const carImages = document.querySelectorAll("[id^='car-image-']");
            for (let i = 0; i < carImages.length; i++) {
                const imgUrl = await fetchCarImages();
                carImages[i].src = `${imgUrl}&w=600&h=300&dpr=2`;
            }
        });
    </script>
</body>
</html>
