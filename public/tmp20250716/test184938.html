<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优车拍拍卖大厅</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-blue-800">优车拍拍卖大厅</h1>
            <div class="flex space-x-4">
                <button class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">登录</button>
                <button class="bg-gray-200 text-gray-800 px-4 py-2 rounded-md hover:bg-gray-300">注册</button>
            </div>
        </header>

        <div class="mb-8">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4">热门拍卖车辆</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-gray-50 p-4 rounded-lg">
                        <img src="https://images.unsplash.com/photo-1563733433500-41b4a7303bd4?ixid=M3w3Nzg5NTl8MHwxfHJhbmRvbXx8fHx8fHx8fDE3NTI2NjI5MTZ8&ixlib=rb-4.1.0&w=300&h=200&dpr=2" alt="Car Auction" class="w-full h-48 object-cover rounded-md mb-4">
                        <h3 class="font-medium text-lg">2023款奥迪A6L</h3>
                        <p class="text-gray-600 mb-2">起拍价: ¥120,000</p>
                        <p class="text-gray-600 mb-2">剩余时间: 2天12小时</p>
                        <button class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700">立即竞拍</button>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-lg">
                        <img src="https://images.unsplash.com/photo-1563733433500-41b4a7303bd4?ixid=M3w3Nzg5NTl8MHwxfHJhbmRvbXx8fHx8fHx8fDE3NTI2NjI5MTZ8&ixlib=rb-4.1.0&w=300&h=200&dpr=2" alt="Car Auction" class="w-full h-48 object-cover rounded-md mb-4">
                        <h3 class="font-medium text-lg">2022款宝马5系</h3>
                        <p class="text-gray-600 mb-2">起拍价: ¥150,000</p>
                        <p class="text-gray-600 mb-2">剩余时间: 1天8小时</p>
                        <button class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700">立即竞拍</button>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-lg">
                        <img src="https://images.unsplash.com/photo-1563733433500-41b4a7303bd4?ixid=M3w3Nzg5NTl8MHwxfHJhbmRvbXx8fHx8fHx8fDE3NTI2NjI5MTZ8&ixlib=rb-4.1.0&w=300&h=200&dpr=2" alt="Car Auction" class="w-full h-48 object-cover rounded-md mb-4">
                        <h3 class="font-medium text-lg">2021款奔驰E级</h3>
                        <p class="text-gray-600 mb-2">起拍价: ¥180,000</p>
                        <p class="text-gray-600 mb-2">剩余时间: 3天6小时</p>
                        <button class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700">立即竞拍</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">拍卖分类</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-gray-50 p-4 rounded-lg text-center">
                    <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-2">
                        <span class="text-blue-600 text-2xl">🚗</span>
                    </div>
                    <p class="font-medium">轿车</p>
                </div>
                <div class="bg-gray-50 p-4 rounded-lg text-center">
                    <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-2">
                        <span class="text-blue-600 text-2xl">🚙</span>
                    </div>
                    <p class="font-medium">SUV</p>
                </div>
                <div class="bg-gray-50 p-4 rounded-lg text-center">
                    <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-2">
                        <span class="text-blue-600 text-2xl">🚐</span>
                    </div>
                    <p class="font-medium">MPV</p>
                </div>
                <div class="bg-gray-50 p-4 rounded-lg text-center">
                    <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-2">
                        <span class="text-blue-600 text-2xl">🏎️</span>
                    </div>
                    <p class="font-medium">跑车</p>
                </div>
            </div>
        </div>

        <footer class="mt-8 text-center text-gray-600">
            <p>© 2023 优车拍拍卖大厅. 版权所有.</p>
        </footer>
    </div>
</body>
</html>
