<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优车拍拍卖大厅</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <!-- 顶部导航栏 -->
    <header class="bg-white shadow-md">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center">
                <h1 class="text-2xl font-bold text-blue-600">优车拍</h1>
            </div>
            <div class="flex items-center space-x-4">
                <div class="relative">
                    <input type="text" placeholder="搜索车辆..." class="px-4 py-2 border rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button class="absolute right-3 top-2 text-gray-500">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </button>
                </div>
                <button class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">登录/注册</button>
            </div>
        </div>
    </header>

    <!-- 筛选区域 -->
    <div class="container mx-auto px-4 py-6">
        <div class="bg-white p-4 rounded-lg shadow-md">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">品牌</label>
                    <select class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option>全部</option>
                        <option>丰田</option>
                        <option>本田</option>
                        <option>大众</option>
                        <option>宝马</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">价格区间</label>
                    <select class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option>全部</option>
                        <option>0-5万</option>
                        <option>5-10万</option>
                        <option>10-20万</option>
                        <option>20万以上</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">车龄</label>
                    <select class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option>全部</option>
                        <option>1年以内</option>
                        <option>1-3年</option>
                        <option>3-5年</option>
                        <option>5年以上</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">里程</label>
                    <select class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option>全部</option>
                        <option>1万公里以内</option>
                        <option>1-5万公里</option>
                        <option>5-10万公里</option>
                        <option>10万公里以上</option>
                    </select>
                </div>
            </div>
            <div class="mt-4 flex justify-end">
                <button class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">筛选</button>
            </div>
        </div>
    </div>

    <!-- 车辆列表 -->
    <div class="container mx-auto px-4 py-6">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-semibold">拍卖车辆</h2>
            <div class="flex items-center space-x-2">
                <span class="text-sm text-gray-600">排序：</span>
                <select class="px-3 py-1 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option>默认</option>
                    <option>价格从低到高</option>
                    <option>价格从高到低</option>
                    <option>剩余时间</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 车辆卡片1 -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-lg transition-shadow">
                <div class="h-48 bg-gray-200 flex items-center justify-center">
                    <span class="text-gray-500">车辆图片</span>
                </div>
                <div class="p-4">
                    <h3 class="text-lg font-semibold mb-2">丰田卡罗拉 2020款</h3>
                    <div class="flex justify-between mb-2">
                        <span class="text-gray-600">起拍价</span>
                        <span class="font-semibold">¥85,000</span>
                    </div>
                    <div class="flex justify-between mb-2">
                        <span class="text-gray-600">里程</span>
                        <span>3.2万公里</span>
                    </div>
                    <div class="flex justify-between mb-4">
                        <span class="text-gray-600">剩余时间</span>
                        <span class="text-red-500">2小时30分</span>
                    </div>
                    <button class="w-full py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">立即竞拍</button>
                </div>
            </div>

            <!-- 车辆卡片2 -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-lg transition-shadow">
                <div class="h-48 bg-gray-200 flex items-center justify-center">
                    <span class="text-gray-500">车辆图片</span>
                </div>
                <div class="p-4">
                    <h3 class="text-lg font-semibold mb-2">本田雅阁 2019款</h3>
                    <div class="flex justify-between mb-2">
                        <span class="text-gray-600">起拍价</span>
                        <span class="font-semibold">¥95,000</span>
                    </div>
                    <div class="flex justify-between mb-2">
                        <span class="text-gray-600">里程</span>
                        <span>4.5万公里</span>
                    </div>
                    <div class="flex justify-between mb-4">
                        <span class="text-gray-600">剩余时间</span>
                        <span class="text-red-500">1小时15分</span>
                    </div>
                    <button class="w-full py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">立即竞拍</button>
                </div>
            </div>

            <!-- 车辆卡片3 -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-lg transition-shadow">
                <div class="h-48 bg-gray-200 flex items-center justify-center">
                    <span class="text-gray-500">车辆图片</span>
                </div>
                <div class="p-4">
                    <h3 class="text-lg font-semibold mb-2">大众途观 2018款</h3>
                    <div class="flex justify-between mb-2">
                        <span class="text-gray-600">起拍价</span>
                        <span class="font-semibold">¥78,000</span>
                    </div>
                    <div class="flex justify-between mb-2">
                        <span class="text-gray-600">里程</span>
                        <span>6.0万公里</span>
                    </div>
                    <div class="flex justify-between mb-4">
                        <span class="text-gray-600">剩余时间</span>
                        <span class="text-red-500">3小时45分</span>
                    </div>
                    <button class="w-full py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">立即竞拍</button>
                </div>
            </div>
        </div>

        <!-- 分页 -->
        <div class="mt-6 flex justify-center">
            <nav class="flex items-center space-x-2">
                <button class="px-3 py-1 border rounded-md hover:bg-gray-100">上一页</button>
                <button class="px-3 py-1 border rounded-md bg-blue-600 text-white">1</button>
                <button class="px-3 py-1 border rounded-md hover:bg-gray-100">2</button>
                <button class="px-3 py-1 border rounded-md hover:bg-gray-100">3</button>
                <button class="px-3 py-1 border rounded-md hover:bg-gray-100">下一页</button>
            </nav>
        </div>
    </div>
</body>
</html>
