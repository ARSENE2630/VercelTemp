<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优车拍拍卖大厅</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center">
                <h1 class="text-xl font-bold text-blue-600">优车拍</h1>
            </div>
            <div class="flex items-center space-x-4">
                <a href="#" class="text-gray-700 hover:text-blue-600">首页</a>
                <a href="#" class="text-gray-700 hover:text-blue-600">拍卖大厅</a>
                <a href="#" class="text-gray-700 hover:text-blue-600">我的竞拍</a>
                <a href="#" class="text-gray-700 hover:text-blue-600">个人中心</a>
            </div>
        </div>
    </nav>

    <!-- 搜索筛选区域 -->
    <div class="container mx-auto px-4 py-6">
        <div class="bg-white rounded-lg shadow-md p-4">
            <div class="flex flex-wrap items-center gap-4">
                <div class="w-full md:w-auto">
                    <label class="block text-sm font-medium text-gray-700 mb-1">品牌</label>
                    <select class="w-full p-2 border border-gray-300 rounded-md">
                        <option>全部</option>
                        <option>奥迪</option>
                        <option>宝马</option>
                        <option>奔驰</option>
                    </select>
                </div>
                <div class="w-full md:w-auto">
                    <label class="block text-sm font-medium text-gray-700 mb-1">价格区间</label>
                    <select class="w-full p-2 border border-gray-300 rounded-md">
                        <option>全部</option>
                        <option>0-5万</option>
                        <option>5-10万</option>
                        <option>10-20万</option>
                    </select>
                </div>
                <div class="w-full md:w-auto">
                    <label class="block text-sm font-medium text-gray-700 mb-1">里程</label>
                    <select class="w-full p-2 border border-gray-300 rounded-md">
                        <option>全部</option>
                        <option>0-5万公里</option>
                        <option>5-10万公里</option>
                        <option>10万公里以上</option>
                    </select>
                </div>
                <div class="w-full md:w-auto">
                    <label class="block text-sm font-medium text-gray-700 mb-1">排序</label>
                    <select class="w-full p-2 border border-gray-300 rounded-md">
                        <option>最新上架</option>
                        <option>价格从低到高</option>
                        <option>价格从高到低</option>
                    </select>
                </div>
                <div class="w-full md:w-auto flex items-end">
                    <button class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">搜索</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 车辆列表 -->
    <div class="container mx-auto px-4 py-6">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 车辆卡片1 -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <div class="h-48 bg-gray-200 flex items-center justify-center">
                    <img id="carImage1" class="w-full h-full object-cover" alt="车辆图片">
                </div>
                <div class="p-4">
                    <h3 class="text-lg font-semibold">奥迪A4L 2020款</h3>
                    <div class="flex justify-between mt-2">
                        <span class="text-gray-600">里程: 3.2万公里</span>
                        <span class="text-gray-600">上牌: 2020年</span>
                    </div>
                    <div class="mt-4">
                        <p class="text-xl font-bold text-blue-600">¥18.5万</p>
                        <div class="flex justify-between items-center mt-2">
                            <span class="text-sm text-gray-500">剩余时间: 2小时30分</span>
                            <button class="bg-red-600 text-white px-3 py-1 rounded-md hover:bg-red-700">立即竞拍</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 车辆卡片2 -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <div class="h-48 bg-gray-200 flex items-center justify-center">
                    <img id="carImage2" class="w-full h-full object-cover" alt="车辆图片">
                </div>
                <div class="p-4">
                    <h3 class="text-lg font-semibold">宝马5系 2019款</h3>
                    <div class="flex justify-between mt-2">
                        <span class="text-gray-600">里程: 5.8万公里</span>
                        <span class="text-gray-600">上牌: 2019年</span>
                    </div>
                    <div class="mt-4">
                        <p class="text-xl font-bold text-blue-600">¥22.3万</p>
                        <div class="flex justify-between items-center mt-2">
                            <span class="text-sm text-gray-500">剩余时间: 1小时45分</span>
                            <button class="bg-red-600 text-white px-3 py-1 rounded-md hover:bg-red-700">立即竞拍</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 车辆卡片3 -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <div class="h-48 bg-gray-200 flex items-center justify-center">
                    <img id="carImage3" class="w-full h-full object-cover" alt="车辆图片">
                </div>
                <div class="p-4">
                    <h3 class="text-lg font-semibold">奔驰C级 2021款</h3>
                    <div class="flex justify-between mt-2">
                        <span class="text-gray-600">里程: 2.1万公里</span>
                        <span class="text-gray-600">上牌: 2021年</span>
                    </div>
                    <div class="mt-4">
                        <p class="text-xl font-bold text-blue-600">¥25.7万</p>
                        <div class="flex justify-between items-center mt-2">
                            <span class="text-sm text-gray-500">剩余时间: 3小时15分</span>
                            <button class="bg
