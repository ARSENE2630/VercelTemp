<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优车拍拍卖大厅</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8">拍卖大厅</h1>
        
        <!-- 筛选和排序区域 -->
        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-lg shadow">
            <div class="flex space-x-4">
                <select class="border rounded px-3 py-2">
                    <option>全部品牌</option>
                    <option>丰田</option>
                    <option>本田</option>
                    <option>宝马</option>
                </select>
                <select class="border rounded px-3 py-2">
                    <option>全部类型</option>
                    <option>轿车</option>
                    <option>SUV</option>
                    <option>MPV</option>
                </select>
                <input type="text" placeholder="价格范围" class="border rounded px-3 py-2 w-32">
            </div>
            <div>
                <select class="border rounded px-3 py-2">
                    <option>默认排序</option>
                    <option>起拍价从低到高</option>
                    <option>起拍价从高到低</option>
                    <option>剩余时间从少到多</option>
                </select>
            </div>
        </div>
        
        <!-- 车辆列表 -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 车辆卡片 1 -->
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <div class="h-48 bg-gray-300 flex items-center justify-center">
                    <span class="text-gray-500">车辆图片</span>
                </div>
                <div class="p-4">
                    <h2 class="text-xl font-semibold mb-2">丰田卡罗拉</h2>
                    <p class="text-gray-600 mb-2">2020年 | 2.0L | 自动挡</p>
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-gray-700">起拍价: ¥50,000</span>
                        <span class="text-red-500 font-bold">当前最高: ¥52,000</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-500">剩余时间: 2小时30分</span>
                        <button class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">立即出价</button>
                    </div>
                </div>
            </div>
            
            <!-- 车辆卡片 2 -->
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <div class="h-48 bg-gray-300 flex items-center justify-center">
                    <span class="text-gray-500">车辆图片</span>
                </div>
                <div class="p-4">
                    <h2 class="text-xl font-semibold mb-2">本田雅阁</h2>
                    <p class="text-gray-600 mb-2">2019年 | 1.5T | 自动挡</p>
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-gray-700">起拍价: ¥60,000</span>
                        <span class="text-red-500 font-bold">当前最高: ¥62,500</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-500">剩余时间: 1小时45分</span>
                        <button class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">立即出价</button>
                    </div>
                </div>
            </div>
            
            <!-- 车辆卡片 3 -->
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <div class="h-48 bg-gray-300 flex items-center justify-center">
                    <span class="text-gray-500">车辆图片</span>
                </div>
                <div class="p-4">
                    <h2 class="text-xl font-semibold mb-2">宝马5系</h2>
                    <p class="text-gray-600 mb-2">2021年 | 2.0T | 自动挡</p>
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-gray-700">起拍价: ¥80,000</span>
                        <span class="text-red-500 font-bold">当前最高: ¥85,000</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-500">剩余时间: 3小时15分</span>
                        <button class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">立即出价</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
