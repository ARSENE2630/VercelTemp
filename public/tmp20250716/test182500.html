<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优车拍拍卖大厅</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <!-- 顶部导航栏 -->
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <img src="https://via.placeholder.com/150x50?text=优车拍Logo" alt="优车拍Logo" class="h-10">
                <div class="relative">
                    <input type="text" placeholder="搜索车辆..." class="border border-gray-300 rounded-full py-2 px-4 w-64 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button class="absolute right-3 top-2 text-gray-500">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <button class="text-gray-700 hover:text-blue-600">登录</button>
                <button class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">注册</button>
            </div>
        </div>
    </nav>

    <!-- 拍卖大厅主区域 -->
    <div class="container mx-auto px-4 py-6">
        <div class="flex flex-col md:flex-row gap-6">
            <!-- 侧边筛选栏 -->
            <div class="w-full md:w-1/4 bg-white p-4 rounded-lg shadow-md">
                <h2 class="text-lg font-semibold mb-4">筛选条件</h2>
                <div class="space-y-4">
                    <div>
                        <h3 class="font-medium mb-2">品牌</h3>
                        <select class="w-full border border-gray-300 rounded-md p-2">
                            <option>全部品牌</option>
                            <option>宝马</option>
                            <option>奔驰</option>
                            <option>奥迪</option>
                        </select>
                    </div>
                    <div>
                        <h3 class="font-medium mb-2">价格区间</h3>
                        <select class="w-full border border-gray-300 rounded-md p-2">
                            <option>全部价格</option>
                            <option>0-5万</option>
                            <option>5-10万</option>
                            <option>10-20万</option>
                        </select>
                    </div>
                    <div>
                        <h3 class="font-medium mb-2">车龄</h3>
                        <select class="w-full border border-gray-300 rounded-md p-2">
                            <option>全部车龄</option>
                            <option>1年以内</option>
                            <option>1-3年</option>
                            <option>3-5年</option>
                        </select>
                    </div>
                    <button class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700">筛选</button>
                </div>
            </div>

            <!-- 车辆列表 -->
            <div class="w-full md:w-3/4">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- 车辆卡片 -->
                    <div class="bg-white rounded-lg shadow-md overflow-hidden">
                        <img src="https://source.unsplash.com/random/300x200/?car&w=300&h=200&dpr=2" alt="车辆图片" class="w-full h-48 object-cover">
                        <div class="p-4">
                            <h3 class="text-lg font-semibold mb-2">宝马 5系 2020款</h3>
                            <p class="text-gray-600 mb-2">里程：3.2万公里</p>
                            <p class="text-gray-600 mb-2">上牌时间：2020年5月</p>
                            <div class="flex justify-between items-center">
                                <span class="text-red-500 font-bold">起拍价：15.8万</span>
                                <span class="text-gray-500">剩余：2天12小时</span>
                            </div>
                            <button class="w-full mt-4 bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700">立即竞拍</button>
                        </div>
                    </div>
                    <div class="bg-white rounded-lg shadow-md overflow-hidden">
                        <img src="https://source.unsplash.com/random/300x200/?car&w=300&h=200&dpr=2" alt="车辆图片" class="w-full h-48 object-cover">
                        <div class="p-4">
                            <h3 class="text-lg font-semibold mb-2">奔驰 E级 2019款</h3>
                            <p class="text-gray-600 mb-2">里程：4.5万公里</p>
                            <p class="text-gray-600 mb-2">上牌时间：2019年8月</p>
                            <div class="flex justify-between items-center">
                                <span class="text-red-500 font-bold">起拍价：18.6万</span>
                                <span class="text-gray-500">剩余：1天8小时</span>
                            </div>
                            <button class="w-full mt-4 bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700">立即竞拍</button>
                        </div>
                    </div>
                    <div class="bg-white rounded-lg shadow-md overflow-hidden">
                        <img src="https://source.unsplash.com/random/300x200/?car&w=300&h=200&dpr=2" alt="车辆图片" class="w-full h-48 object-cover">
                        <div class="p-4">
                            <h3 class="text-lg font-semibold mb-2">奥迪 A6L 2021款</h3>
                            <p class="text-gray-600 mb-2">里程：2.1万公里</p>
                            <p class="text-gray-600 mb-2">上牌时间：2021年3月</p>
                            <div class="flex justify-between items-center">
                                <span class="text-red-500 font-bold">起拍价：20.3万</span>
                                <span class="text-gray-500">剩余：3天5小时</span>
                            </div>
                            <button class="w-full mt-4 bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700">立即竞拍</button>
                        </div>
                    </div>
                </div>
                <!-- 分页 -->
                <div class="mt-6 flex justify-center">
