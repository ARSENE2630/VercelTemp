<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoSmart Sales - 智慧销售助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        /* 自定义滚动条 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        
        /* 渐变背景 */
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        
        /* AI对话气泡 */
        .ai-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px 20px 5px 20px;
        }
        
        .user-bubble {
            background: #f1f5f9;
            color: #334155;
            border-radius: 20px 20px 20px 5px;
        }
        
        /* 加载动画 */
        .loading-dots {
            display: inline-block;
        }
        .loading-dots:after {
            content: ' .';
            animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: ' .'; }
            40% { content: ' ..'; }
            60% { content: ' ...'; }
            80%, 100% { content: ''; }
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 顶部导航栏 -->
    <nav class="gradient-bg text-white shadow-lg">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <div class="bg-white p-2 rounded-lg">
                        <i class="fas fa-car text-purple-600 text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold">AutoSmart Sales</h1>
                        <p class="text-sm opacity-80">智慧销售助手 v2.0</p>
                    </div>
                </div>
                
                <div class="flex items-center space-x-4">
                    <div class="hidden md:flex items-center space-x-4">
                        <div class="relative">
                            <i class="fas fa-bell text-xl"></i>
                            <span class="absolute -top-1 -right-1 bg-red-500 text-xs rounded-full w-5 h-5 flex items-center justify-center">3</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <div class="w-8 h-8 bg-white rounded-full overflow-hidden">
                                <img src="https://images.unsplash.com/photo-1695902173528-0b15104c4554?ixid=M3w3Nzg5NTl8MHwxfHJhbmRvbXx8fHx8fHx8fDE3Njk1MzQyMDl8&ixlib=rb-4.1.0&w=80&h=80&dpr=2" alt="销售顾问" class="w-full h-full object-cover">
                            </div>
                            <div>
                                <p class="font-medium">张经理</p>
                                <p class="text-xs opacity-80">金牌销售顾问</p>
                            </div>
                        </div>
                    </div>
                    <button class="md:hidden text-xl">
                        <i class="fas fa-bars"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区域 -->
    <div class="container mx-auto px-4 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- 左侧区域：AI助手和仪表板 -->
            <div class="lg:col-span-2 space-y-6">
                <!-- AI智能助手区域 -->
                <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
                    <div class="gradient-bg text-white p-6">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center space-x-3">
                                <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center">
                                    <i class="fas fa-robot text-2xl text-purple-600"></i>
                                </div>
                                <div>
                                    <h2 class="text-xl font-bold">AI智能销售助手</h2>
                                    <p class="text-sm opacity-90">24小时在线，为您提供专业销售支持</p>
                                </div>
                            </div>
                            <div class="bg-white text-purple-600 px-4 py-2 rounded-full font-medium">
                                <i class="fas fa-bolt mr-2"></i>在线中
                            </div>
                        </div>
                    </div>
                    
                    <!-- AI对话区域 -->
                    <div class="p-6">
                        <div class="h-80 overflow-y-auto space-y-4 mb-4 p-2">
                            <!-- AI消息 -->
                            <div class="flex justify-start">
                                <div class="ai-bubble p-4 max-w-xs md:max-w-md">
                                    <p>您好！我是您的AI销售助手。今天有什么可以帮助您的吗？</p>
                                    <p class="text-xs opacity-80 mt-2">刚刚更新了最新的车辆库存和促销信息</p>
                                </div>
                            </div>
                            
                            <!-- 用户消息 -->
                            <div class="flex justify-end">
                                <div class="user-bubble p-4 max-w-xs md:max-w-md">
                                    <p>我想了解一下店里最新的SUV车型，适合家庭使用的</p>
                                </div>
                            </div>
                            
                            <!-- AI回复 -->
                            <div class="flex justify-start">
                                <div class="ai-bubble p-4 max-w-xs md:max-w-md">
                                    <p>好的！我们目前有3款适合家庭使用的SUV：</p>
                                    <div class="mt-3 space-y-2">
                                        <div class="flex items-center bg-white/20 p-2 rounded-lg">
                                            <i class="fas fa-car mr-2"></i>
                                            <span>丰田RAV4混动版 - 省油实用</span>
                                        </div>
                                        <div class="flex items-center bg-white/20 p-2 rounded-lg">
                                            <i class="fas fa-car mr-2"></i>
                                            <span>本田CR-V豪华版 - 空间宽敞</span>
                                        </div>
                                        <div class="flex items-center bg-white/20 p-2 rounded-lg">
                                            <i class="fas fa-car mr-2"></i>
                                            <span>大众途观L - 德系品质</span>
                                        </div>
                                    </div>
                                    <p class="mt-3">您对哪款更感兴趣？我可以为您详细介绍。</p>
                                </div>
                            </div>
                            
                            <!-- AI正在输入 -->
                            <div class="flex justify-start">
                                <div class="ai-bubble p-4">
                                    <p>正在为您查询最新的促销政策<span class="loading-dots"></span></p>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 输入区域 -->
                        <div class="border-t pt-4">
                            <div class="flex space-x-2">
                                <input type="text" placeholder="输入您的问题..." class="flex-1 border rounded-full px-6 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500">
                                <button class="gradient-bg text-white p-3 rounded-full hover:opacity-90 transition">
                                    <i class="fas fa-paper-plane"></i>
                                </button>
                            </div>
                            <div class="flex justify-between mt-3">
                                <div class="flex space-x-2">
                                    <button class="text-sm bg-gray-100 hover:bg-gray-200 px-3 py-1 rounded-full transition">
                                        <i class="fas fa-car mr-1"></i>车辆
