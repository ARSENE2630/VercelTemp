<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧汽车销售助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E40AF',
                        secondary: '#3B82F6',
                        accent: '#F59E0B',
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .animate-float {
                animation: float 3s ease-in-out infinite;
            }
            .animate-pulse-slow {
                animation: pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            }
        }
    </style>
</head>
<body class="font-sans bg-gray-50">
    <!-- 底部导航栏 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-50">
        <div class="flex justify-around items-center h-16">
            <a href="#home" class="flex flex-col items-center justify-center text-primary">
                <i class="fa fa-home text-xl"></i>
                <span class="text-xs mt-1">首页</span>
            </a>
            <a href="#ai-assistant" class="flex flex-col items-center justify-center text-gray-500">
                <i class="fa fa-robot text-xl"></i>
                <span class="text-xs mt-1">AI助手</span>
            </a>
            <a href="#models" class="flex flex-col items-center justify-center text-gray-500">
                <i class="fa fa-car text-xl"></i>
                <span class="text-xs mt-1">车型</span>
            </a>
            <a href="#test-drive" class="flex flex-col items-center justify-center text-gray-500">
                <i class="fa fa-calendar-check-o text-xl"></i>
                <span class="text-xs mt-1">预约</span>
            </a>
            <a href="#account" class="flex flex-col items-center justify-center text-gray-500">
                <i class="fa fa-user text-xl"></i>
                <span class="text-xs mt-1">我的</span>
            </a>
        </div>
    </nav>

    <!-- 首页 -->
    <div id="home" class="pb-16">
        <!-- 顶部搜索栏 -->
        <div class="bg-primary text-white p-4">
            <div class="container mx-auto flex items-center justify-between">
                <h1 class="text-xl font-bold">智慧汽车销售助手</h1>
                <div class="relative w-2/3">
                    <input type="text" placeholder="搜索车型或服务" class="w-full py-2 pl-10 pr-4 rounded-full bg-white/20 text-white placeholder-white/70 focus:outline-none focus:bg-white/30">
                    <i class="fa fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-white/70"></i>
                </div>
            </div>
        </div>

        <!-- 轮播图 -->
        <div class="relative overflow-hidden">
            <div class="flex transition-transform duration-500 ease-in-out">
                <div class="min-w-full h-48 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1708791149576-2220d3c34ad2?crop=entropy&cs=srgb&fm=jpg&ixid=M3w3Nzg5NTl8MHwxfHJhbmRvbXx8fHx8fHx8fDE3Njk1MzQ3MDZ8&ixlib=rb-4.1.0&q=85&w=1200&h=600');"></div>
            </div>
            <div class="absolute bottom-2 left-1/2 transform -translate-x-1/2 flex space-x-2">
                <span class="w-2 h-2 rounded-full bg-white"></span>
                <span class="w-2 h-2 rounded-full bg-white/50"></span>
                <span class="w-2 h-2 rounded-full bg-white/50"></span>
            </div>
        </div>

        <!-- 门店信息 -->
        <div class="container mx-auto p-4">
            <h2 class="text-xl font-bold mb-4">我们的门店</h2>
            <div class="bg-white rounded-lg shadow-md p-4">
                <div class="flex items-center mb-2">
                    <i class="fa fa-map-marker text-accent mr-2"></i>
                    <span>上海市浦东新区张江高科技园区博云路2号</span>
                </div>
                <div class="flex items-center mb-2">
                    <i class="fa fa-phone text-accent mr-2"></i>
                    <span>400-888-8888</span>
                </div>
                <div class="flex items-center">
                    <i class="fa fa-clock-o text-accent mr-2"></i>
                    <span>营业时间: 周一至周日 9:00-18:00</span>
                </div>
            </div>
        </div>

        <!-- 热门车型 -->
        <div class="container mx-auto p-4">
            <h2 class="text-xl font-bold mb-4">热门车型</h2>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white rounded-lg shadow-md overflow-hidden">
                    <div class="h-32 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1620891549027-942fdc95d3f5?crop=entropy&cs=srgb&fm=jpg&ixid=M3w3Nzg5NTl8MHwxfHJhbmRvbXx8fHx8fHx8fDE3Njk1MzQ3MDl8&ixlib=rb-4.1.0&q=85&w=800&h=600');"></div>
                    <div class="p-3">
                        <h3 class="font-bold">特斯拉 Model 3</h3>
                        <p class="text-sm text-gray-500">纯电动轿车</p>
                        <p class="text-accent font-bold mt-1">¥299,900 起</p>
                    </div>
                </div>
                <div class="bg-white rounded-lg shadow-md overflow-hidden">
                    <div class="h-32 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1617886323080-87e3f6e03615?crop=entropy&cs=srgb&fm=jpg&ixid=M3w3Nzg5NTl8MHwxfHJhbmRvbXx8fHx8fHx8fDE3Njk1MzQ3MDl8&ixlib=rb-4.1.0&q=85&w=800&h=600');"></div>
                    <div class="p-3">
                        <h3 class="font-bold">宝马 X5</h3>
                        <p class="text-sm text-gray-500">豪华 SUV</p>
                        <p class="text-accent font-bold mt-1">¥699,900 起</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 特色服务 -->
        <div class="container mx-auto p-4">
            <h2 class="text-xl font-bold mb-4">特色服务</h2>
            <div class="grid grid-cols-3 gap-4">
                <div class="bg-white rounded-lg shadow-md p-3 text-center">
                    <i class="fa fa-wrench text-primary text-2xl mb-2"></i>
                    <p class="text-sm">专业维修</p>
                </div>
                <div class="bg-white rounded-lg shadow-md p-3 text-center">
                    <i class="fa fa-car text-primary text-2xl mb-2"></i>
                    <p class="text-sm">试驾体验</p>
                </div>
                <div class="bg-white rounded-lg shadow-md p-3 text-center">
                    <i class="fa fa-shopping-cart text-primary text-2xl mb-2
