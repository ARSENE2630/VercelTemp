<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汽车销售助手 AI 应用</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4">
        <header class="bg-blue-600 text-white p-4 rounded-lg shadow-md">
            <h1 class="text-2xl font-bold">汽车销售助手 AI</h1>
            <p class="text-sm">智能推荐、客户管理、销售分析一体化解决方案</p>
        </header>

        <main class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4">智能推荐</h2>
                <img src="https://images.unsplash.com/photo-1761593280913-2d33f93f65d7?ixid=M3w3Nzg5NTl8MHwxfHJhbmRvbXx8fHx8fHx8fDE3Njk1MzE3MDJ8&ixlib=rb-4.1.0&w=600&h=400&dpr=2" alt="智能推荐" class="rounded-lg mb-4">
                <p class="text-gray-700">根据客户需求，AI 智能推荐最适合的车型和配置。</p>
                <button class="mt-4 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">开始推荐</button>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4">客户管理</h2>
                <img src="https://images.unsplash.com/photo-1761593280913-2d33f93f65d7?ixid=M3w3Nzg5NTl8MHwxfHJhbmRvbXx8fHx8fHx8fDE3Njk1MzE3MDJ8&ixlib=rb-4.1.0&w=600&h=400&dpr=2" alt="客户管理" class="rounded-lg mb-4">
                <p class="text-gray-700">记录客户信息，跟踪购车意向，提升销售转化率。</p>
                <button class="mt-4 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">管理客户</button>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4">销售分析</h2>
                <img src="https://images.unsplash.com/photo-1761593280913-2d33f93f65d7?ixid=M3w3Nzg5NTl8MHwxfHJhbmRvbXx8fHx8fHx8fDE3Njk1MzE3MDJ8&ixlib=rb-4.1.0&w=600&h=400&dpr=2" alt="销售分析" class="rounded-lg mb-4">
                <p class="text-gray-700">实时分析销售数据，优化销售策略。</p>
                <button class="mt-4 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">查看分析</button>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4">AI 助手</h2>
                <img src="https://images.unsplash.com/photo-1761593280913-2d33f93f65d7?ixid=M3w3Nzg5NTl8MHwxfHJhbmRvbXx8fHx8fHx8fDE3Njk1MzE3MDJ8&ixlib=rb-4.1.0&w=600&h=400&dpr=2" alt="AI 助手" class="rounded-lg mb-4">
                <p class="text-gray-700">24/7 在线解答客户疑问，提升客户体验。</p>
                <button class="mt-4 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">启动助手</button>
            </div>
        </main>

        <footer class="mt-8 text-center text-gray-500 text-sm">
            <p>© 2023 汽车销售助手 AI. 保留所有权利。</p>
        </footer>
    </div>
</body>
</html>
