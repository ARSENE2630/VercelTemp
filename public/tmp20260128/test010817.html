<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧销售助手 - 汽车门店</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#4f46e5',
                        accent: '#f97316',
                        dark: '#1e293b',
                        light: '#f8fafc'
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .app-shadow {
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            }
            .card-hover {
                transition: all 0.3s ease;
            }
            .card-hover:hover {
                transform: translateY(-5px);
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            }
        }
    </style>
</head>
<body class="bg-gray-50 font-inter text-dark">
    <!-- 顶部导航栏 -->
    <header class="bg-white app-shadow fixed top-0 left-0 right-0 z-50">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-10 h-10 rounded-lg bg-primary flex items-center justify-center">
                    <i class="fa fa-car text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold">智慧销售助手</h1>
                    <p class="text-xs text-gray-500">汽车门店专属</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <button class="relative">
                    <i class="fa fa-bell-o text-gray-600 text-xl"></i>
                    <span class="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-accent flex items-center justify-center">
                        <span class="text-white text-xs">3</span>
                    </span>
                </button>
                <div class="flex items-center space-x-2">
                    <img src="https://images.unsplash.com/photo-1569781195388-04bfbc91506d?crop=entropy&cs=srgb&fm=jpg&ixid=M3w3Nzg5NTl8MHwxfHJhbmRvbXx8fHx8fHx8fDE3Njk1MzM2MDR8&ixlib=rb-4.1.0&q=85&w=40&h=40&fit=crop" alt="用户头像" class="w-10 h-10 rounded-full object-cover">
                    <span class="text-sm font-medium">张销售</span>
                </div>
            </div>
        </div>
    </header>

    <!-- 主内容区域 -->
    <main class="container mx-auto px-4 pt-24 pb-16">
        <!-- 统计卡片区域 -->
        <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="bg-white rounded-xl p-6 app-shadow card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">今日新增客户</p>
                        <h3 class="text-2xl font-bold mt-1">12</h3>
                        <p class="text-green-500 text-xs mt-2 flex items-center">
                            <i class="fa fa-arrow-up mr-1"></i> 20% 较昨日
                        </p>
                    </div>
                    <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center">
                        <i class="fa fa-users text-primary text-xl"></i>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-xl p-6 app-shadow card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">今日销售订单</p>
                        <h3 class="text-2xl font-bold mt-1">5</h3>
                        <p class="text-green-500 text-xs mt-2 flex items-center">
                            <i class="fa fa-arrow-up mr-1"></i> 15% 较昨日
                        </p>
                    </div>
                    <div class="w-12 h-12 rounded-full bg-green-100 flex items-center justify-center">
                        <i class="fa fa-shopping-cart text-green-600 text-xl"></i>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-xl p-6 app-shadow card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">试驾预约</p>
                        <h3 class="text-2xl font-bold mt-1">8</h3>
                        <p class="text-red-500 text-xs mt-2 flex items-center">
                            <i class="fa fa-arrow-down mr-1"></i> 5% 较昨日
                        </p>
                    </div>
                    <div class="w-12 h-12 rounded-full bg-yellow-100 flex items-center justify-center">
                        <i class="fa fa-calendar-check-o text-yellow-600 text-xl"></i>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-xl p-6 app-shadow card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">本月销售额</p>
                        <h3 class="text-2xl font-bold mt-1">¥128万</h3>
                        <p class="text-green-500 text-xs mt-2 flex items-center">
                            <i class="fa fa-arrow-up mr-1"></i> 35% 较上月
                        </p>
                    </div>
                    <div class="w-12 h-12 rounded-full bg-purple-100 flex items-center justify-center">
                        <i class="fa fa-line-chart text-purple-600 text-xl"></i>
                    </div>
                </div>
            </div>
        </section>

        <!-- 主要功能区域 -->
        <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- 左侧：客户管理 -->
            <div class="lg:col-span-2 space-y-6">
                <!-- 客户列表 -->
                <div class="bg-white rounded-xl app-shadow overflow-hidden">
                    <div class="p-6 border-b border-gray-100">
                        <div class="flex items-center justify-between">
                            <h2 class="text-lg font-bold">客户管理</h2>
                            <button class="px-3 py-1 bg-primary text-white rounded-lg text-sm flex items-center space-x-1">
                                <i class="fa fa-plus"></i>
                                <span>新增客户</span>
                            </button>
                        </div>
                    </div>
                    <div class="p-4">
                        <div class="flex items-center space-x-2 mb-4">
                            <input type="text" placeholder="搜索客户..." class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50">
                            <select class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50">
                                <option>全部状态</option>
                                <option>潜在客户</option>
                                <option>意向客户</option>
                                <option>成交客户</option>
                                <option>流失客户</option>
                            </select>
                        </div>
                        
                        <div class="space-y-3">
                            <!-- 客户卡片1 -->
                            <div class="border border-gray-200 rounded-lg p-4 hover:border-primary/50 transition-all">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center space-x-3">
                                        <img src="https://images.unsplash.com/photo-1569781195388-04bfbc91506d?crop=entropy&cs=srgb&fm=jpg&ixid=M3w3Nzg5NTl8MHwxfHJhbmRvbXx8fHx8fHx8fDE3Njk1MzM2MDR8&ixlib=rb-4.1.0&q=85&w=50&h=50&fit=crop" alt="客户头像" class="w-12 h-12 rounded-full object-cover">
                                        <div>
                                            <h3 class="font-medium">李先生</h3>
                                            <p class="text-sm text-gray-500">138****5678</p>
                                        </div>
                                    </div>
                                    <span class="px-2 py-1 bg-blue-100 text-blue-700 rounded-full text-xs">意向客户</span>
                                </div>
                                <div class="mt-3 flex items-center justify-between">
                                    <div class="flex items-center space-x-4 text-sm">
                                        <span class="flex items-center text-gray-600">
                                            <i class="fa fa-car mr-1"></i>
                                            <span>关注Model 3</span>
                                        </span>
                                        <span class="flex items-center text-gray-600">
                                            <i class="fa fa-clock-o mr-1"></i>
                                            <span>3天前跟进</span>
                                        </span>
                                    </div>
                                    <div class="flex space-x-2">
                                        <button class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-gray-200">
                                            <i class="fa fa-phone"></i>
                                        </button>
                                        <button class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-gray-200">
                                            <i class="fa fa-commenting-o"></i>
                                        </button>
                                        <button class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-gray-200">
                                            <i class="fa fa-calendar"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- 客户卡片2 -->
                            <div class="border border-gray-200 rounded-lg p-4 hover:border-primary/50 transition-all">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center space-x-3">
                                        <img src="https://images.unsplash.com/photo-1583440048272-ee306a8807ad?crop=entropy&cs=srgb&fm=jpg&ixid=M3w3Nzg5NTl8MHwxfHJhbmRvbXx8fHx8fHx8fDE3Njk1MzM2MDR8&ixlib=rb-4.1.0&q=85&w=50&h=50&fit=crop" alt="客户头像" class="w-12 h-12 rounded-full object-cover">
                                        <div>
                                            <h3 class="font-medium">王女士</h3>
                                            <p class="text-sm text-gray-500">135****8901</p>
                                        </div>
                                    </div>
                                    <span class="px-2 py-1 bg-green-100 text-green-700 rounded-full text-xs">成交客户</span>
                                </div>
                                <div class="mt-3 flex items-center justify-between">
                                    <div class="flex items-center space-x-4 text-sm">
                                        <span class="flex items-center text-gray-600">
                                            <i class="fa fa-car mr-1"></i>
                                            <span>已购Model Y</span>
                                        </span>
                                        <span class="flex items-center text-gray-600">
                                            <i class="fa fa-clock-o mr-1"></i>
                                            <span>1天前跟进</span>
                                        </span>
                                    </div>
                                    <div class="flex space-x-2">
                                        <button class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-gray-200">
                                            <i class="fa fa-phone"></i>
                                        </button>
                                        <button class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-gray-200">
                                            <i class="fa fa-commenting-o"></i>
                                        </button>
                                        <button class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-gray-200">
                                            <i class="fa fa-calendar"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- 客户卡片3 -->
                            <div class="border border-gray-200 rounded-lg p-4 hover:border-primary/50 transition-all">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center space-x-3">
                                        <img src="https://images.unsplash.com/photo-1584608788960-1a62ca168467?crop=entropy&cs=srgb&fm=jpg&ixid=M3w3Nzg5NTl8MHwxfHJhbmRvbXx8fHx8fHx8fDE3Njk1MzM2MDR8&ixlib=rb-4.1.0&q=85&w=50&h=50&fit=crop" alt="客户头像" class="w-12 h-12 rounded-full object-cover">
                                        <div>
                                            <h3 class="font-medium">张先生</h3>
                                            <p class="text-sm text-gray-500">139****2345</p>
                                        </div>
                                    </div>
                                    <span class="px-2 py-1 bg-yellow-100 text-yellow-700 rounded-full text-xs">潜在客户</span>
                                </div>
                                <div class="mt-3 flex items-center justify-between">
                                    <div class="flex items-center space-x-4 text-sm">
                                        <span class="flex items-center text-gray-600">
                                            <i class="fa fa-car mr-1"></i>
                                            <span>关注汉EV</span>
                                        </span>
                                        <span class="flex items-center text-gray-600">
                                            <i class="fa fa-clock-o mr-1"></i>
                                            <span>1周前跟进</span>
                                        </span>
                                    </div>
                                    <div class="flex space-x-2">
                                        <button class="w-8 h-8
