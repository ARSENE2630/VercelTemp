<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汽车门店智慧销售线索管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        
        * {
            font-family: 'Noto Sans SC', sans-serif;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .card-shadow {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .sidebar-item:hover {
            background-color: rgba(102, 126, 234, 0.1);
            border-left: 3px solid #667eea;
        }
        
        .sidebar-item.active {
            background-color: rgba(102, 126, 234, 0.1);
            border-left: 3px solid #667eea;
            color: #667eea;
        }
        
        .transition-all {
            transition: all 0.3s ease;
        }
        
        .page-fade {
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .table-row:hover {
            background-color: rgba(0, 0, 0, 0.02);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 侧边栏 -->
    <div class="flex h-screen">
        <aside class="w-64 bg-white shadow-md hidden md:block transition-all duration-300">
            <div class="p-5">
                <div class="flex items-center">
                    <i class="fas fa-car text-3xl text-blue-600 mr-3"></i>
                    <h1 class="text-xl font-bold text-gray-800">智慧线索管理</h1>
                </div>
            </div>
            
            <nav class="mt-6">
                <a href="#" class="flex items-center px-5 py-3 text-gray-700 sidebar-item active transition-all duration-300">
                    <i class="fas fa-chart-line mr-3"></i>
                    <span>数据仪表盘</span>
                </a>
                <a href="#" class="flex items-center px-5 py-3 text-gray-700 sidebar-item transition-all duration-300">
                    <i class="fas fa-users mr-3"></i>
                    <span>线索管理</span>
                </a>
                <a href="#" class="flex items-center px-5 py-3 text-gray-700 sidebar-item transition-all duration-300">
                    <i class="fas fa-user-tie mr-3"></i>
                    <span>客户管理</span>
                </a>
                <a href="#" class="flex items-center px-5 py-3 text-gray-700 sidebar-item transition-all duration-300">
                    <i class="fas fa-chart-bar mr-3"></i>
                    <span>销售统计</span>
                </a>
                <a href="#" class="flex items-center px-5 py-3 text-gray-700 sidebar-item transition-all duration-300">
                    <i class="fas fa-cog mr-3"></i>
                    <span>系统设置</span>
                </a>
            </nav>
            
            <div class="absolute bottom-0 w-full p-5 border-t border-gray-200">
                <div class="flex items-center">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-r from-blue-500 to-purple-600 flex items-center justify-center text-white mr-3">
                        <i class="fas fa-user"></i>
                    </div>
                    <div>
                        <div class="font-medium text-gray-800">张三</div>
                        <div class="text-sm text-gray-500">销售经理</div>
                    </div>
                </div>
            </div>
        </aside>
        
        <!-- 主内容区域 -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <!-- 顶部导航栏 -->
            <header class="bg-white shadow-sm z-10">
                <div class="flex items-center justify-between px-6 py-4">
                    <div class="flex items-center">
                        <button class="md:hidden mr-4 text-gray-500">
                            <i class="fas fa-bars text-xl"></i>
                        </button>
                        <h2 class="text-2xl font-bold text-gray-800">数据仪表盘</h2>
                    </div>
                    
                    <div class="flex items-center space-x-4">
                        <button class="relative p-2 text-gray-500 hover:text-blue-600 transition-colors">
                            <i class="fas fa-bell text-xl"></i>
                            <span class="absolute top-0 right-0 w-3 h-3 bg-red-500 rounded-full"></span>
                        </button>
                        <button class="relative p-2 text-gray-500 hover:text-blue-600 transition-colors">
                            <i class="fas fa-envelope text-xl"></i>
                            <span class="absolute top-0 right-0 w-3 h-3 bg-red-500 rounded-full"></span>
                        </button>
                        <div class="flex items-center space-x-2">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-r from-blue-500 to-purple-600 flex items-center justify-center text-white">
                                <i class="fas fa-user"></i>
                            </div>
                            <span class="hidden sm:inline font-medium text-gray-800">张三</span>
                        </div>
                    </div>
                </div>
            </header>
            
            <!-- 内容区域 -->
            <div class="flex-1 overflow-y-auto p-6">
                <!-- 统计卡片 -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8 page-fade">
                    <div class="bg-white rounded-xl p-6 card-shadow hover:shadow-lg transition-shadow duration-300">
                        <div class="flex items-center justify-between mb-4">
                            <div class="w-12 h-12 rounded-lg bg-blue-100 flex items-center justify-center">
                                <i class="fas fa-lead-pencil text-blue-600 text-xl"></i>
                            </div>
                            <span class="text-green-500 text-sm font-medium">+12.5%</span>
                        </div>
                        <div class="text-3xl font-bold text-gray-800 mb-1">128</div>
                        <div class="text-gray-500 text-sm">本月线索量</div>
                    </div>
                    
                    <div class="bg-white rounded-xl p-6 card-shadow hover:shadow-lg transition-shadow duration-300">
                        <div class="flex items-center justify-between mb-4">
                            <div class="w-12 h-12 rounded-lg bg-green-100 flex items-center justify-center">
                                <i class="fas fa-check-circle text-green-600 text-xl"></i>
                            </div>
                            <span class="text-green-500 text-sm font-medium">+8.2%</span>
                        </div>
                        <div class="text-3xl font-bold text-gray-800 mb-1">36</div>
                        <div class="text-gray-500 text-sm">已成交客户</div>
                    </div>
                    
                    <div class="bg-white rounded-xl p-6 card-shadow hover:shadow-lg transition-shadow duration-300">
                        <div class="flex items-center justify-between mb-4">
                            <div class="w-12 h-12 rounded-lg bg-yellow-100 flex items-center justify-center">
                                <i class="fas fa-clock text-yellow-600 text-xl"></i>
                            </div>
                            <span class="text-red-500 text-sm font-medium">-2.1%</span>
                        </div>
                        <div class="text-3xl font-bold text-gray-800 mb-1">45</div>
                        <div class="text-gray-500 text-sm">跟进中线索</div>
                    </div>
                    
                    <div class
