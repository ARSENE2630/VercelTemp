<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>运动类APP高保真原型</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-md p-4 fixed w-full top-0 z-10">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-600">FitTrack</h1>
            <div class="flex space-x-4">
                <a href="#" class="text-gray-700 hover:text-blue-600">首页</a>
                <a href="#" class="text-gray-700 hover:text-blue-600">运动</a>
                <a href="#" class="text-gray-700 hover:text-blue-600">社区</a>
                <a href="#" class="text-gray-700 hover:text-blue-600">我的</a>
            </div>
        </div>
    </nav>

    <!-- 首页 -->
    <div class="container mx-auto mt-20 p-4">
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-2xl font-bold mb-4">今日运动数据</h2>
            <div class="grid grid-cols-3 gap-4">
                <div class="bg-blue-100 p-4 rounded-lg text-center">
                    <p class="text-gray-600">步数</p>
                    <p class="text-2xl font-bold">8,542</p>
                </div>
                <div class="bg-green-100 p-4 rounded-lg text-center">
                    <p class="text-gray-600">卡路里</p>
                    <p class="text-2xl font-bold">320</p>
                </div>
                <div class="bg-purple-100 p-4 rounded-lg text-center">
                    <p class="text-gray-600">距离</p>
                    <p class="text-2xl font-bold">5.2 km</p>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-2xl font-bold mb-4">推荐训练计划</h2>
            <div class="flex overflow-x-auto space-x-4 pb-2">
                <div class="flex-shrink-0 w-64 bg-blue-50 rounded-lg p-4">
                    <img src="https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b" alt="跑步训练" class="w-full h-32 object-cover rounded-lg mb-2">
                    <h3 class="font-bold">跑步训练</h3>
                    <p class="text-sm text-gray-600">30分钟 | 初级</p>
                </div>
                <div class="flex-shrink-0 w-64 bg-green-50 rounded-lg p-4">
                    <img src="https://images.unsplash.com/photo-1571019614242-c5c5a98be117" alt="瑜伽训练" class="w-full h-32 object-cover rounded-lg mb-2">
                    <h3 class="font-bold">瑜伽训练</h3>
                    <p class="text-sm text-gray-600">20分钟 | 中级</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 运动记录 -->
    <div class="container mx-auto p-4">
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-2xl font-bold mb-4">开始运动</h2>
            <div class="flex justify-center mb-4">
                <button class="bg-blue-600 text-white px-6 py-3 rounded-full font-bold">开始跑步</button>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-gray-100 p-4 rounded-lg">
                    <p class="text-gray-600">目标</p>
                    <p class="text-xl font-bold">5 km</p>
                </div>
                <div class="bg-gray-100 p-4 rounded-lg">
                    <p class="text-gray-600">时间</p>
                    <p class="text-xl font-bold">30 min</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 社交互动 -->
    <div class="container mx-auto p-4">
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-2xl font-bold mb-4">社区动态</h2>
            <div class="space-y-4">
                <div class="flex items-start space-x-3">
                    <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330" alt="用户头像" class="w-10 h-10 rounded-full">
                    <div>
                        <p class="font-bold">用户A</p>
                        <p class="text-gray-600">刚刚完成了5公里跑步！</p>
                        <div class="flex space-x-4 mt-2">
                            <button class="text-blue-600">点赞</button>
                            <button class="text-blue-600">评论</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-2xl font-bold mb-4">好友排行榜</h2>
            <div class="space-y-3">
                <div class="flex justify-between items-center">
                    <div class="flex items-center space-x-3">
                        <span class="font-bold">1</span>
                        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330" alt="用户头像" class="w-8 h-8 rounded-full">
                        <p>用户A</p>
                    </div>
                    <p class="font-bold">8,542 步</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 个人中心 -->
    <div class="container mx-auto p-4 mb-20">
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-2xl font-bold mb-4">个人中心</h2>
            <div class="flex items-center space-x-4 mb-6">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330" alt="用户头像" class="w-16 h-16 rounded-full">
                <div>
                    <p class="font-bold">用户A</p>
                    <p class="text-gray-600">运动爱好者</p>
                </div>
            </div>
            <div class="space-y-4">
                <div class="flex justify-between items-center p-3 bg-gray-100 rounded-lg">
                    <p>健康数据</p>
                    <button class="text-blue-600">查看</button>
                </div>
                <div class="flex justify-between items-center p-3 bg-gray-100 rounded-lg">
                    <p>设置</p>
                    <button class="text-blue-600">进入</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部导航 -->
    <div class="fixed bottom-0 w-full bg-white shadow-md p-3">
        <div class="container mx-auto flex justify-around">
            <a href="#" class="text-blue-600">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                <p class="text-xs">首页</p>
            </a>
            <a href="#" class="text-gray-600">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                </svg>
                <p class="text-xs">运动</p>
            </a>
            <a href="#" class="text-gray-600">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
                <p class="text-xs">社区</p>
            </a>
            <a href="#" class="text-gray-600">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                <p class="text-xs">我的</p>
            </a>
        </div>
    </div>
</body>
</html>
