<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化工行业可视化大屏</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: white;
        }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: auto 1fr 1fr;
            gap: 16px;
            padding: 16px;
            height: 100vh;
        }
        .header {
            grid-column: 1 / -1;
            text-align: center;
            padding: 16px;
            background-color: #1e293b;
            border-radius: 8px;
        }
        .card {
            background-color: #1e293b;
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .chart {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- 标题栏 -->
        <div class="header">
            <h1 class="text-2xl font-bold">化工生产可视化大屏</h1>
            <div class="flex justify-center space-x-4 mt-4">
                <button class="bg-blue-500 hover:bg-blue-600 px-4 py-2 rounded-lg">实时数据</button>
                <button class="bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded-lg">日数据</button>
                <button class="bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded-lg">周数据</button>
                <button class="bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded-lg">月数据</button>
            </div>
        </div>

        <!-- 生产数据 -->
        <div class="card">
            <h2 class="text-xl font-semibold mb-4">生产数据</h2>
            <div id="productionChart" class="chart"></div>
        </div>

        <!-- 能耗数据 -->
        <div class="card">
            <h2 class="text-xl font-semibold mb-4">能耗数据</h2>
            <div id="energyChart" class="chart"></div>
        </div>

        <!-- 设备状态 -->
        <div class="card">
            <h2 class="text-xl font-semibold mb-4">设备状态</h2>
            <div id="deviceChart" class="chart"></div>
        </div>

        <!-- 安全预警 -->
        <div class="card">
            <h2 class="text-xl font-semibold mb-4">安全预警</h2>
            <div id="alertChart" class="chart"></div>
        </div>

        <!-- KPI指标 -->
        <div class="card">
            <h2 class="text-xl font-semibold mb-4">KPI指标</h2>
            <div id="kpiChart" class="chart"></div>
        </div>

        <!-- 数据分析 -->
        <div class="card">
            <h2 class="text-xl font-semibold mb-4">数据分析</h2>
            <div id="analysisChart" class="chart"></div>
        </div>
    </div>

    <script>
        // 初始化图表
        const productionChart = echarts.init(document.getElementById('productionChart'));
        const energyChart = echarts.init(document.getElementById('energyChart'));
        const deviceChart = echarts.init(document.getElementById('deviceChart'));
        const alertChart = echarts.init(document.getElementById('alertChart'));
        const kpiChart = echarts.init(document.getElementById('kpiChart'));
        const analysisChart = echarts.init(document.getElementById('analysisChart'));

        // 生产数据图表配置
        productionChart.setOption({
            tooltip: {},
            xAxis: {
                type: 'category',
                data: ['生产线1', '生产线2', '生产线3', '生产线4']
            },
            yAxis: { type: 'value' },
            series: [{
                data: [120, 200, 150, 80],
                type: 'bar',
                itemStyle: { color: '#3b82f6' }
            }]
        });

        // 能耗数据图表配置
        energyChart.setOption({
            tooltip: {},
            xAxis: {
                type: 'category',
                data: ['电力', '水', '天然气']
            },
            yAxis: { type: 'value' },
            series: [{
                data: [300, 150, 200],
                type: 'line',
                itemStyle: { color: '#10b981' }
            }]
        });

        // 设备状态图表配置
        deviceChart.setOption({
            tooltip: {},
            series: [{
                type: 'pie',
                data: [
                    { value: 80, name: '运行中', itemStyle: { color: '#10b981' } },
                    { value: 10, name: '停机', itemStyle: { color: '#ef4444' } },
                    { value: 10, name: '维护中', itemStyle: { color: '#f59e0b' } }
                ]
            }]
        });

        // 安全预警图表配置
        alertChart.setOption({
            tooltip: {},
            xAxis: {
                type: 'category',
                data: ['温度', '压力', '气体浓度']
            },
            yAxis: { type: 'value' },
            series: [{
                data: [25, 40, 15],
                type: 'bar',
                itemStyle: { color: '#ef4444' }
            }]
        });

        // KPI指标图表配置
        kpiChart.setOption({
            tooltip: {},
            radar: {
                indicator: [
                    { name: '生产效率', max: 100 },
                    { name: '能耗比', max: 100 },
                    { name: '安全评分', max: 100 }
                ]
            },
            series: [{
                type: 'radar',
                data: [{ value: [85, 70, 90], itemStyle: { color: '#8b5cf6' } }]
            }]
        });

        // 数据分析图表配置
        analysisChart.setOption({
            tooltip: {},
            xAxis: {
                type: 'category',
                data: ['1月', '2月', '3月', '4月', '5月', '6月']
            },
            yAxis: { type: 'value' },
            series: [{
                data: [120, 132, 101, 134, 90, 160],
                type: 'line',
                itemStyle: { color: '#f59e0b' }
            }]
        });
    </script>
</body>
</html>
