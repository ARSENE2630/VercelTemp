<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>青少年AI实验平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 导航栏 -->
    <nav class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <img src="https://images.unsplash.com/photo-1610563166150-b34df4f3bcd6?w=100" alt="Logo" class="w-10 h-10 rounded-full">
                <span class="text-xl font-bold">AI实验工坊</span>
            </div>
            <div class="hidden md:flex space-x-6">
                <a href="#" class="hover:text-blue-200">首页</a>
                <a href="#" class="hover:text-blue-200">实验工坊</a>
                <a href="#" class="hover:text-blue-200">项目库</a>
                <a href="#" class="hover:text-blue-200">社区</a>
                <a href="#" class="hover:text-blue-200">成就</a>
            </div>
            <div class="flex items-center space-x-4">
                <button class="bg-blue-500 hover:bg-blue-700 px-4 py-2 rounded-lg">登录</button>
                <button class="bg-white text-blue-600 hover:bg-gray-100 px-4 py-2 rounded-lg">注册</button>
            </div>
        </div>
    </nav>

    <!-- 英雄区域 -->
    <section class="bg-gradient-to-r from-blue-500 to-purple-600 text-white py-16">
        <div class="container mx-auto text-center px-4">
            <h1 class="text-4xl md:text-5xl font-bold mb-4">探索AI的奇妙世界</h1>
            <p class="text-xl mb-8">通过实验和项目，轻松学习人工智能！</p>
            <div class="flex justify-center space-x-4">
                <button class="bg-white text-blue-600 hover:bg-gray-100 px-6 py-3 rounded-lg font-semibold">开始实验</button>
                <button class="bg-transparent border-2 border-white hover:bg-white hover:text-blue-600 px-6 py-3 rounded-lg font-semibold">观看教程</button>
            </div>
        </div>
    </section>

    <!-- 功能模块展示 -->
    <section class="py-12 bg-white">
        <div class="container mx-auto px-4">
            <h2 class="text-3xl font-bold text-center mb-12">核心功能</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <!-- AI实验工坊 -->
                <div class="bg-gray-50 p-6 rounded-lg shadow-md hover:shadow-lg transition-shadow">
                    <img src="https://images.unsplash.com/photo-1501504905252-473c47e087f8?w=300" alt="AI实验工坊" class="w-full h-48 object-cover rounded-lg mb-4">
                    <h3 class="text-xl font-semibold mb-2">AI实验工坊</h3>
                    <p class="text-gray-600">拖拽式编程界面，轻松完成AI实验。</p>
                    <button class="mt-4 bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg">立即体验</button>
                </div>
                <!-- 项目库 -->
                <div class="bg-gray-50 p-6 rounded-lg shadow-md hover:shadow-lg transition-shadow">
                    <img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=300" alt="项目库" class="w-full h-48 object-cover rounded-lg mb-4">
                    <h3 class="text-xl font-semibold mb-2">项目库</h3>
                    <p class="text-gray-600">丰富的AI项目，从入门到进阶。</p>
                    <button class="mt-4 bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg">查看项目</button>
                </div>
                <!-- 学习社区 -->
                <div class="bg-gray-50 p-6 rounded-lg shadow-md hover:shadow-lg transition-shadow">
                    <img src="https://images.unsplash
